name: Build VideoWallpaper

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: VideoWallpaper

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild VideoWallpaper.sln /p:Configuration=Release /p:Platform=Win32

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: VideoWallpaper
          path: VideoWallpaper/bin/Win32/Release/**
            VideoWallpaper/Release/**
            VideoWallpaper/x64/Release/**
            VideoWallpaper/x86/Release/**
